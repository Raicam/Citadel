<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyBay - Torrent Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>☠ MyBay</h1>
  <input type="text" id="search" placeholder="Search torrents..." onkeyup="render()">
</div>

<div class="menu">
  <a href="#" onclick="setCategory('all')">All</a> |
  <a href="#" onclick="setCategory('movies')">Movies</a> |
  <a href="#" onclick="setCategory('games')">Games</a>
</div>

<div id="torrent-container">
  <table class="torrent-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Size</th>
        <th>Magnet</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<div class="pagination">
  <button id="prev" onclick="prevPage()">Prev</button>
  <span id="page-info"></span>
  <button id="next" onclick="nextPage()">Next</button>
</div>

<script src="data.js"></script>
<script>
const PAGE_SIZE = 50;
let currentCategory = "all";
let currentPage = 1;

function setCategory(cat) {
  currentCategory = cat;
  currentPage = 1;
  render();
}

function filteredData() {
  const search = document.getElementById("search").value.toLowerCase();
  return DATA.filter(item =>
    (currentCategory === "all" || item.category === currentCategory) &&
    item.title.toLowerCase().includes(search)
  );
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const data = filteredData();
  const totalPages = Math.ceil(data.length / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageData = data.slice(start, end);

  pageData.forEach(item => {
    let desc = item.description ? `<div class="desc">${item.description}</div>` : "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="title">${item.title}</span>${desc}</td>
      <td>${item.size}</td>
      <td><a href="${item.magnet}">Magnet</a></td>
    `;
    list.appendChild(tr);
  });

  document.getElementById("page-info").innerText = `Page ${currentPage} of ${totalPages || 1}`;
  document.getElementById("prev").disabled = currentPage === 1;
  document.getElementById("next").disabled = currentPage === totalPages || totalPages === 0;
}

function prevPage() {
  if(currentPage > 1) currentPage--;
  render();
}

function nextPage() {
  const totalPages = Math.ceil(filteredData().length / PAGE_SIZE);
  if(currentPage < totalPages) currentPage++;
  render();
}

render();
</script>

</body>
</html>
